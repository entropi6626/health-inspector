<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Realtime Health & Classification Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    h1, h2 {
      margin: 1rem 0 0.5rem;
    }
    .data {
      font-size: 1.4rem;
      margin: 0.5rem;
    }
    canvas {
      width: 95vw !important;
      max-width: 100%;
      margin: 1rem auto;
      display: block;
    }
    .flags {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin: 1rem 0;
    }
    .flag {
      padding: 0.5rem 1rem;
      border: 1px solid #666;
      border-radius: 4px;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <h1>Health Monitor Dashboard</h1>

  <div class="data">Heart Rate: <span id="hr">–</span> BPM</div>
  <canvas id="hrChart" height="250"></canvas>

  <div class="data">SpO₂: <span id="spo2">–</span>%</div>
  <canvas id="spo2Chart" height="250"></canvas>

  <div class="data">Current Label: <strong id="label">–</strong></div>

  <div class="flags">
    <div class="flag">Fatal: <span id="fatal">–</span></div>
    <div class="flag">Hazardous: <span id="hazard">–</span></div>
    <div class="flag">Call Placed: <span id="call">–</span></div>
    <div class="flag">Finger: <span id="finger">–</span></div>
  </div>

  <h2>30s Rolling Averages (per Label)</h2>
  <canvas id="avgLabelChart" height="300"></canvas>

  <h2>Latest Averages Bar Chart</h2>
  <canvas id="barLabelChart" height="300"></canvas>

  <script>
    const FB_URL = 'https://espserver-db31d-default-rtdb.firebaseio.com/realtime.json';
    const MAX_POINTS = 60;

    const times = [];
    const hrData = [];
    const spo2Data = [];

    let avgLabelChart, barLabelChart;
    let avgDatasets = [], barLabels = [], barData = [];

    const hrChart = new Chart(document.getElementById('hrChart'), {
      type: 'line',
      data: { labels: times, datasets: [{ label: 'HR (BPM)', data: hrData, fill: true }] },
      options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
    });

    const spo2Chart = new Chart(document.getElementById('spo2Chart'), {
      type: 'line',
      data: { labels: times, datasets: [{ label: 'SpO₂ (%)', data: spo2Data, fill: true }] },
      options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
    });

    function initLabelCharts(labelKeys) {
      avgDatasets = labelKeys.map(key => ({
        label: key,
        data: [],
        fill: false,
      }));
      avgLabelChart = new Chart(document.getElementById('avgLabelChart'), {
        type: 'line',
        data: { labels: times, datasets: avgDatasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: { y: { min: 0, max: 1 } }
        }
      });

      barLabels = labelKeys;
      barData   = new Array(labelKeys.length).fill(0);
      barLabelChart = new Chart(document.getElementById('barLabelChart'), {
        type: 'bar',
        data: {
          labels: barLabels,
          datasets: [{ label: '30s Avg Probability', data: barData }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: { y: { min: 0, max: 1 } }
        }
      });
    }

    async function fetchAndRender() {
      try {
        const res = await fetch(FB_URL);
        const d = await res.json();
        const now = new Date().toLocaleTimeString();

        const finger = !!d.fingerOn;
        document.getElementById('finger').innerText = finger ? 'Yes' : 'No';

        if (!finger) {
          document.getElementById('hr').innerText    = '–';
          document.getElementById('spo2').innerText  = '–';
          document.getElementById('label').innerText = '–';
          document.getElementById('fatal').innerText = '–';
          document.getElementById('hazard').innerText= '–';
          document.getElementById('call').innerText  = '–';

          times.length = 0;
          hrData.length = 0;
          spo2Data.length = 0;
          if (avgDatasets.length) avgDatasets.forEach(ds => ds.data.length = 0);
          if (barData.length) barData.fill(0);

          hrChart.update();
          spo2Chart.update();
          if (avgLabelChart) avgLabelChart.update();
          if (barLabelChart) {
            barLabelChart.data.datasets[0].data = barData;
            barLabelChart.update();
          }

        } else {
          document.getElementById('hr').innerText    = d.hr.toFixed(0);
          document.getElementById('spo2').innerText  = d.spo2.toFixed(1);
          document.getElementById('label').innerText = d.label;
          document.getElementById('fatal').innerText = d.fatalCondition;
          document.getElementById('hazard').innerText= d.hazardousCondition;
          document.getElementById('call').innerText  = d.callPlaced;

          if (!avgLabelChart) {
            initLabelCharts(Object.keys(d.avgLabels));
          }

          if (times.length >= MAX_POINTS) {
            times.shift();
            hrData.shift();
            spo2Data.shift();
            avgDatasets.forEach(ds => ds.data.shift());
          }

          times.push(now);
          hrData.push(d.hr);
          spo2Data.push(d.spo2);

          avgDatasets.forEach((ds, i) => {
            const v = d.avgLabels[ds.label] || 0;
            ds.data.push(v);
            barData[i] = v;
          });

          hrChart.update();
          spo2Chart.update();
          avgLabelChart.update();
          barLabelChart.data.datasets[0].data = barData;
          barLabelChart.update();
        }

      } catch (err) {
        console.error('Fetch error:', err);
      }

      setTimeout(fetchAndRender, 4000);
    }

    window.onload = fetchAndRender;
  </script>
</body>
</html>
